<svg viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4ff" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>
    
    <!-- Node gradients -->
    <linearGradient id="input-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    
    <linearGradient id="memory-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <linearGradient id="context-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddd6fe" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    
    <linearGradient id="output-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddd6fe" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="recursion-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    
    <linearGradient id="meta-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    
    <!-- Arrow markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    
    <marker id="arrowhead-active" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6" />
    </marker>
    
    <marker id="arrowhead-recursion" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-gradient)" rx="15" ry="15" />
  
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#4338ca">
    Recursive Cleverbot AI Learning Architecture
  </text>
  
  <!-- Main System Border - represents the primary system -->
  <rect x="40" y="70" width="820" height="510" rx="20" ry="20" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" />
  <text x="450" y="90" font-family="Arial, sans-serif" font-size="16" font-style="italic" text-anchor="middle" fill="#475569">Primary Processing System</text>
  
  <!-- Input Layer -->
  <g id="input-layer">
    <rect x="60" y="110" width="180" height="100" rx="15" ry="15" fill="url(#input-gradient)" opacity="0.8" stroke="#6366f1" stroke-width="2" />
    <text x="150" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">Input Processing</text>
    <text x="150" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- User Text Tokenization</text>
    <text x="150" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Word Extraction</text>
    <text x="150" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Sentence Structure Analysis</text>
  </g>
  
  <!-- Wikipedia Lookup Module -->
  <g id="wiki-lookup">
    <rect x="310" y="110" width="180" height="100" rx="15" ry="15" fill="#fef3c7" opacity="0.9" stroke="#f59e0b" stroke-width="2" />
    <text x="400" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">Wikipedia Lookup</text>
    <text x="400" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Topic Extraction</text>
    <text x="400" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Knowledge Extraction</text>
    <text x="400" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Contextual Learning</text>
  </g>
  
  <!-- Memory Systems -->
  <g id="memory-systems">
    <rect x="180" y="250" width="420" height="140" rx="15" ry="15" fill="url(#memory-gradient)" opacity="0.8" stroke="#6366f1" stroke-width="2" />
    <text x="390" y="275" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">Memory Systems</text>
    
    <!-- Brain.js Neural Network -->
    <rect x="200" y="290" width="140" height="80" rx="10" ry="10" fill="#f0f9ff" opacity="0.9" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="270" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">LSTM Network</text>
    <text x="270" y="335" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">- Word Associations</text>
    <text x="270" y="350" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">- Pattern Recognition</text>
    
    <!-- Phrase Mapping -->
    <rect x="360" y="290" width="220" height="80" rx="10" ry="10" fill="#f0fdf4" opacity="0.9" stroke="#10b981" stroke-width="1.5" />
    <text x="470" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Phrase Mapping</text>
    <text x="470" y="335" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">- Weighted Connections</text>
    <text x="470" y="350" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">- Contextual Links</text>
  </g>
  
  <!-- Context Mapper -->
  <g id="context-mapper">
    <rect x="180" y="420" width="420" height="120" rx="15" ry="15" fill="url(#context-gradient)" opacity="0.8" stroke="#8b5cf6" stroke-width="2" />
    <text x="390" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">Enhanced Context Mapping</text>
    
    <!-- Sentence Structure Recorder -->
    <rect x="200" y="460" width="180" height="60" rx="10" ry="10" fill="#f5f3ff" opacity="0.9" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="290" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Sentence Structure</text>
    <text x="290" y="500" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">- Template Storage/Retrieval</text>
    
    <!-- Contextual Memory -->
    <rect x="400" y="460" width="180" height="60" rx="10" ry="10" fill="#fdf2f8" opacity="0.9" stroke="#d946ef" stroke-width="1.5" />
    <text x="490" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Word Relationships</text>
    <text x="490" y="500" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">- Semantic Network Building</text>
  </g>
  
  <!-- Response Generation -->
  <g id="response-generation">
    <rect x="650" y="250" width="180" height="140" rx="15" ry="15" fill="url(#output-gradient)" opacity="0.8" stroke="#ec4899" stroke-width="2" />
    <text x="740" y="275" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">Response Generation</text>
    <text x="740" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Template Selection</text>
    <text x="740" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Contextual Filling</text>
    <text x="740" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Grammar Correction</text>
    <text x="740" y="360" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Natural Language Output</text>
  </g>
  
  <!-- Learning Processes -->
  <g id="learning-processes">
    <rect x="650" y="110" width="180" height="100" rx="15" ry="15" fill="#fee2e2" opacity="0.8" stroke="#ef4444" stroke-width="2" />
    <text x="740" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">Learning Processes</text>
    <text x="740" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Memory Decay</text>
    <text x="740" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Contextual Weighting</text>
    <text x="740" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Pattern Reinforcement</text>
  </g>
  
  <!-- Flow Arrows within Primary System -->
  <!-- Input to Wiki -->
  <path d="M240 160 H310" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Input to Memory -->
  <path d="M150 210 V320 H200" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Wiki to Memory -->
  <path d="M400 210 V250" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Wiki to Context -->
  <path d="M490 160 H560 V420" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead-active)" fill="none" />
  
  <!-- Memory to Context -->
  <path d="M390 390 V420" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead-active)" fill="none" />
  
  <!-- Context to Response -->
  <path d="M600 480 H650 V320" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead-active)" fill="none" />
  
  <!-- Memory to Response -->
  <path d="M600 320 H650" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Learning to Memory/Context -->
  <path d="M740 210 V230 H600 V250" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <path d="M650 180 H620 V420" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Feedback Loop -->
  <path d="M780 390 H800 V560 H80 V210 H150" stroke="#64748b" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowhead)" fill="none" />
  <text x="400" y="580" font-family="Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#475569">Learning Feedback Loop</text>

  <!-- NEW RECURSIVE ELEMENTS -->
  
  <!-- Recursive System Container -->
  <rect x="100" y="610" width="700" height="150" rx="15" ry="15" fill="url(#recursion-gradient)" opacity="0.6" stroke="#0ea5e9" stroke-width="3" />
  <text x="450" y="630" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e293b">Recursive Self-Evaluation System</text>
  
  <!-- Recursive Components -->
  <rect x="120" y="650" width="200" height="90" rx="10" ry="10" fill="white" opacity="0.8" stroke="#0ea5e9" stroke-width="2" />
  <text x="220" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">Performance Analyzer</text>
  <text x="220" y="690" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Response Quality Metrics</text>
  <text x="220" y="705" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Conversation Success Rate</text>
  <text x="220" y="720" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Pattern Effectiveness Scoring</text>
  
  <rect x="350" y="650" width="200" height="90" rx="10" ry="10" fill="white" opacity="0.8" stroke="#0ea5e9" stroke-width="2" />
  <text x="450" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">Meta-Learning Engine</text>
  <text x="450" y="690" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Architecture Optimization</text>
  <text x="450" y="705" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Parameter Auto-Tuning</text>
  <text x="450" y="720" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Learning Strategy Refinement</text>
  
  <rect x="580" y="650" width="200" height="90" rx="10" ry="10" fill="white" opacity="0.8" stroke="#0ea5e9" stroke-width="2" />
  <text x="680" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">System Evolution</text>
  <text x="680" y="690" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Module Generation</text>
  <text x="680" y="705" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Neural Pathway Creation</text>
  <text x="680" y="720" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">- Autonomous Improvement</text>
  
  <!-- Recursive Connections -->
  <!-- From Primary to Recursive -->
  <path d="M400 540 V610" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrowhead-recursion)" fill="none" />
  <text x="410" y="580" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#0ea5e9">Performance Data</text>
  
  <path d="M700 390 V500 H750 V610" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrowhead-recursion)" fill="none" />
  <text x="760" y="550" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#0ea5e9">Response Metrics</text>
  
  <!-- Between Recursive Components -->
  <path d="M320 695 H350" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-recursion)" fill="none" />
  <path d="M550 695 H580" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-recursion)" fill="none" />
  
  <!-- From Recursive back to Primary -->
  <path d="M220 650 V600 H90 V320" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrowhead-recursion)" fill="none" stroke-dasharray="5,5" />
  <text x="95" y="440" font-family="Arial, sans-serif" font-size="12" transform="rotate(-90, 95, 440)" fill="#0ea5e9">Memory Optimization</text>
  
  <path d="M450 650 V520 H550 V480" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrowhead-recursion)" fill="none" stroke-dasharray="5,5" />
  <text x="560" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#0ea5e9">Context Enhancement</text>
  
  <path d="M680 650 V520 H770 V390" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrowhead-recursion)" fill="none" stroke-dasharray="5,5" />
  <text x="780" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#0ea5e9">Response Refinement</text>
  
  <!-- Legend -->
  <rect x="305" y="770" width="290" height="20" rx="5" ry="5" fill="white" opacity="0.7" stroke="#94a3b8" stroke-width="1" />
  
  <line x1="320" y1="780" x2="350" y2="780" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="360" y="783" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#1e293b">Standard Flow</text>
  
  <line x1="440" y1="780" x2="470" y2="780" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead-active)" />
  <text x="480" y="783" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#1e293b">Contextual Flow</text>
  
  <line x1="560" y1="780" x2="590" y2="780" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-recursion)" />
  <text x="600" y="783" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#1e293b">Recursive Flow</text>
</svg>